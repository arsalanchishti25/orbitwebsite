<!-- Purpose: Bootstrap Orbit's AngularJS application; replaces the vanilla-JS page wiring from js/app.js. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Orbit is a calm, focused space for managing tasks and deadlines.">
  <title>Orbit | Personal Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body ng-app="orbit" ng-strict-di ng-cloak>
  <orbit-app></orbit-app>

  <script src="lib/angular.min.js"></script>
  <script src="js/app.module.js"></script>
  <script src="js/core/storage.service.js"></script>
  <script src="js/core/countdown.service.js"></script>
  <script src="js/core/clock.service.js"></script>
  <script src="js/core/toast.service.js"></script>
  <script src="js/core/modal.service.js"></script>
  <script src="js/core/task.service.js"></script>
  <script src="js/filters/countdown.filter.js"></script>
  <script src="js/filters/orbit-date.filter.js"></script>
  <script src="js/components/orbit-app.js"></script>
  <script src="js/components/orbit-sidebar.js"></script>
  <script src="js/components/orbit-topbar.js"></script>
  <script src="js/components/orbit-welcome.js"></script>
  <script src="js/components/orbit-metrics.js"></script>
  <script src="js/components/task-panel.js"></script>
  <script src="js/components/upcoming-panel.js"></script>
  <script src="js/components/task-modal.js"></script>
  <script src="js/components/orbit-toast.js"></script>
</body>
</html>
